<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Amnos Centro Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f8ff;
            color: #003366;
        }
        .navbar { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .nav-link { font-weight: 500; margin-right: 1rem; color: #003366 !important; }
        .nav-link:hover { color: #003366 !important; }
        .logo-amnos { margin-top: 25%; transform: scale(2); transform-origin: left center; }
        .btn-agendar { background-color: #1a3edb; color: white; border-radius: 8px; padding: 0.8rem 1.5rem; font-weight: bold; transition: background 0.3s; }
        .btn-agendar:hover { background-color: #003366; color: white; }
        .navbar-brand img { width: 60px; height: 60px; margin-right: 10px; }

        .parent { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 20px; perspective: 1000px; }
        .card { position: relative; width: 300px; padding-top: 50px; border: 3px solid #fff; transform-style: preserve-3d; background-size: 60px 60px; background-position: 0 0, 0 0; background-color: #f0f0f0; box-shadow: rgba(142,142,142,0.3) 0px 30px 30px -10px; transition: all 0.5s ease-in-out; }
        .card:hover { background-position: -10px 10px, -10px 10px; transform: rotate3d(0.5,1,0,15deg); }
        .content-box {
            background: #003366;
            transition: all 0.5s ease-in-out;
            padding: 60px 25px 25px 25px; /* Padding consistente */
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Tudo começa no mesmo alinhamento à esquerda */
        }

        .card-title {
            color: white;
            font-size: 25px;
            font-weight: 900;
            width: 100%; /* Ocupa toda a largura do content-box */
            margin: 0; /* Remove margens inconsistentes */
        }

        .card-content {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            color: #f2f2f2;
        }

        .see-more {
            cursor: pointer;
            margin-top: 1rem;
            display: inline-block;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            color: rgb(0, 0, 0);
            background: white;
            padding: 0.5rem 0.7rem;
            text-decoration: none;
        }

        .date-box { position: absolute; top: 30px; right: 30px; height: 60px; width: 60px; background: white; border: 1px solid rgb(0, 51, 102); padding: 10px; transform: translate3d(0px,0px,80px); box-shadow: rgba(100,100,111,0.2) 0px 17px 10px -10px; }
        .date-box span { display: block; text-align: center; }
        .date-box .month { color: #003366;); font-size: 9px; font-weight: 700; }
        .date-box .date { font-size: 14px; font-size: 60%; color: #003366; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar-cliente :: navbar-cliente"></div>

<!-- Conteúdo dinâmico -->
<div th:include="${pagina}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
