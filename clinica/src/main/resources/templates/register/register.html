        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="mb-3"  sec:authorize="hasRole('ADMIN')">
                <label for="roles" class="form-label fw-bold">Roles:</label>
                <select id="roles" name="roles" class="form-select" multiple required>
                    <option value="ROLE_CLIENTE" selected>Cliente</option>
                    <option value="ROLE_MEDICO">Médico</option>
                    <option value="ROLE_SECRETARIO">Secretário</option>
                    <option value="ROLE_ADMIN">Administrador</option>
                </select>
                <div class="form-text">Segure CTRL (Windows) ou CMD (Mac) para selecionar mais de um.</div>
            </div>


            <button type="submit" class="btn btn-success w-100">Cadastrar</button>
        </form>
        <hr>
        <p class="text-center mb-0">
            Já tem conta? <a th:href="@{/templates/login}">Faça login</a>
        </p>
