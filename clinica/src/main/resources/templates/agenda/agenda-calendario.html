<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agenda do Médico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .calendar-day {
            height: 120px;
            vertical-align: top;
        }
        .bloqueado {
            background-color: #f8f9fa;
            color: #999;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Agenda de <span th:text="${medico.nome}"></span> - <span th:text="${mesNome}"></span> <span th:text="${ano}"></span></h2>

    <table class="table table-bordered text-center align-middle">
        <thead class="table-light">
        <tr>
            <th>Dom</th>
            <th>Seg</th>
            <th>Ter</th>
            <th>Qua</th>
            <th>Qui</th>
            <th>Sex</th>
            <th>Sáb</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="semana : ${calendario}">
            <td th:each="dia : ${semana}"
                th:classappend="${dia != null and (dia.data.dayOfWeek.name() == 'SATURDAY' or dia.data.dayOfWeek.name() == 'SUNDAY')} ? 'bloqueado calendar-day' : 'calendar-day'">
                <div th:if="${dia != null}">
                    <strong th:text="${dia.dia}"></strong><br/>
                    <a class="btn btn-sm btn-outline-primary mt-2"
                       th:if="${!(dia.data.dayOfWeek.name() == 'SATURDAY' or dia.data.dayOfWeek.name() == 'SUNDAY')}"
                       th:href="@{|/secretaria/${medico.id}/agenda/horarios?data=${dia.data}|}">
                        + Horário
                    </a>
                    <span th:if="${dia.data.dayOfWeek.name() == 'SATURDAY' or dia.data.dayOfWeek.name() == 'SUNDAY'}">
                        Indisponível
                    </span>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
