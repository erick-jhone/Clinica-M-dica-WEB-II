<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head"></head>
<body>
<div th:replace="fragments/navbar :: navbar" sec:authorize="hasAnyRole('ADMIN','SECRETARIO', 'MEDICO')"></div>


<div class="container mt-4">
    <h1 class="text-center mb-5" style="color: #003366;">
        Prontuário de <span th:text="${paciente.nome}"></span>
    </h1>

    <div class="row align-items-start">
        <div th:each="consulta : ${consultas}" class="col-sm-6 col-md-4 col-lg-3 mb-4 d-flex">
            <div class="card shadow-lg rounded-3 card-hover flex-fill h-auto">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Consulta em <span th:text="${consulta.agenda.data}"></span></h5>
                    <p class="card-subtitle mb-2"><b>Médico:</b> <span th:text="${consulta.medico.nome}"></span></p>

                    <!-- Campos que vão aparecer no hover -->
                    <div class="hover-details">
                        <p class="card-text"><b>Descrição:</b> <span th:text="${consulta.descricao}"></span></p>
                        <h6>Exames Solicitados:</h6>
                        <table class="table table-sm table-bordered">
                            <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Tipo</th>
                                <th>Observações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="exame : ${consulta.exames}">
                                <td th:text="${exame.nome}"></td>
                                <td th:text="${exame.tipo}"></td>
                                <td th:text="${exame.observacoes}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(consulta.exames)}">
                                <td colspan="3">Nenhum exame solicitado nesta consulta.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<style>
    /* Card neon flutuante */
    .card-hover {
        background-color: #003366; /* azul do card */
        color: #ffffff;
        border-radius: 1rem;
        /* sombra escura */
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        border: none;
    }

    .card-hover:hover {
        transform: translateY(-15px) scale(1.03);
        background-color: #ffffff;
        color: #003366;
        /* sombra mais intensa ao hover */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 0, 0, 0.5);
    }

    /* Título e subtítulo */
    .card-title {
        font-weight: 700;
        font-size: 1.3rem;
    }

    .card-subtitle {
        font-weight: 500;
        color: inherit;
    }

    /* Tabela dentro do card */
    table {
        border-radius: 0.5rem;
        overflow: hidden;
        background-color: rgba(255, 255, 255, 0.05); /* fundo semi-transparente */
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }

    table thead {
        background-color: rgba(255,255,255,0.2);
        color: #ffffff;
        font-weight: 600;
    }

    table th, table td {
        padding: 0.5rem;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        color: inherit;
    }

    table tbody tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.05);
    }

    table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.15);
        transition: background-color 0.2s;
    }

    /* Ajuste para o texto do corpo da tabela */
    table td {
        font-size: 0.9rem;
        word-break: break-word;
    }

    .hover-details {
        opacity: 0;
        max-height: 0;
        overflow: hidden;
        transition: opacity 0.3s ease, max-height 0.3s ease;
    }

    /* Mostra detalhes ao passar o mouse no card */
    .card-hover:hover .hover-details {
        opacity: 1;
        max-height: 1000px; /* valor grande suficiente para o conteúdo */
    }

    .card-subtitle {
        font-weight: 500;
        color: #ffffff; /* branco por padrão */
        transition: color 0.3s ease;
    }

    .card-hover:hover .card-subtitle {
        color: #003366; /* azul escuro ao passar o mouse */
    }


</style>
</body>
</html>
